<!DOCTYPE html>
<html>
<head>
<title>ICE TASK 3</title>
</head>
<body>

<!-- QUESTION 1 -->
<p id="q1">What is my experience?</p>
<button onclick="q1Func()">Answer</button>

<hr><br>

<!-- QUESTION 2 -->
<input type="number" id="q2Input" placeholder="Enter number">
<button onclick="q2Func()">Double It</button>
<p>Result: <span id="q2Result"></span></p>

<hr><br>

<!-- QUESTION 3 -->
<input type="number" id="n1" placeholder="First number">
<input type="number" id="n2" placeholder="Second number">
<button onclick="q3Func()">Calculate Average</button>
<p>Average: <span id="q3Result"></span></p>

<script>
function q1Func(){
document.getElementById("q1").innerText="This is my first JavaScript code";
}
function q2Func(){
let v=document.getElementById("q2Input").value;
document.getElementById("q2Result").innerText=v*2;
}
function q3Func(){
let a=parseFloat(document.getElementById("n1").value);
let b=parseFloat(document.getElementById("n2").value);
document.getElementById("q3Result").innerText=(a+b)/2;
}
</script>
</body>
</html>
