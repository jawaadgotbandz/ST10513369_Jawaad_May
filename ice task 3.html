<!DOCTYPE html>
<html><body>
<p id="q1">What is my experience?</p>
<button onclick="document.getElementById('q1').innerText='This is my first JavaScript code'">Answer</button>
<hr><br>
<input id="q2" type="number" placeholder="Enter number">
<button onclick="document.getElementById('r2').innerText=document.getElementById('q2').value*2">Double It</button>
<span id="r2"></span>
<hr><br>
<input id="a" type="number" placeholder="First">
<input id="b" type="number" placeholder="Second">
<button onclick="document.getElementById('r3').innerText=(parseFloat(document.getElementById('a').value)+parseFloat(document.getElementById('b').value))/2">Calculate Average</button>
<span id="r3"></span>
</body></html>
